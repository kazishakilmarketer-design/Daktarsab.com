<!-- Doctor Saab Favicon SVG — Stethoscope on emerald green -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Emerald green circle background -->
  <circle cx="50" cy="50" r="50" fill="#0d9668"/>
  <!-- Stethoscope: tubing -->
  <path d="M30 28 C30 28 26 36 26 46 C26 58 36 66 46 66 C56 66 66 58 66 46 C66 36 62 28 62 28"
        fill="none" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <!-- Stethoscope: earpieces -->
  <circle cx="30" cy="26" r="5" fill="white"/>
  <circle cx="62" cy="26" r="5" fill="white"/>
  <!-- Stethoscope: chestpiece -->
  <circle cx="46" cy="66" r="9" fill="white"/>
  <circle cx="46" cy="66" r="5.5" fill="#0d9668"/>
  <!-- Connecting tube going down -->
  <line x1="46" y1="66" x2="46" y2="78" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <!-- Bottom circle (diaphragm) -->
  <circle cx="46" cy="80" r="6" fill="white"/>
</svg>
